monorepo_root = true

[monorepo]
config_roots = ["frontend", "backend", "docs"]

[tools]
node = "24.20.0"
"npm:pnpm" = "10.34.7"
"npm:wrangler" = "4.151.1"
"npm:oxfmt" = "0.73.0"
"npm:oxlint" = "1.88.0"

[settings]
npm.package_manager = "npm"

[tasks.setup]
description = "依存パッケージをインストールし、開発用の型を生成する"
run = [
	"pnpm install --frozen-lockfile",
	{ task = "//:gen" },
	{ task = "//frontend:sync" },
	{ task = "//:hooks:install" }
]

[tasks.dev]
description = "フロントエンドとバックエンドを並列起動する"
depends = ["//frontend:dev", "//backend:dev"]

[tasks.gen]
description = "Cloudflare Workersの型を生成する"
depends = ["//frontend:gen", "//backend:gen"]

[tasks.check]
description = "フロントエンドとバックエンドの型を検査する"
depends = ["//frontend:check", "//backend:check"]

[tasks.build]
description = "アプリと資料をビルドする（公開しない）"
depends = ["//frontend:build", "//backend:build", "//docs:build"]

[tasks.verify]
description = "整形・lint・全体ビルド・全ユニットテストとカバレッジを順に検証する"
run = [
	{ task = "//:format:check" },
	{ task = "//:lint" },
	{ task = "//:build" },
	{ task = "//:test:coverage" }
]

[tasks.lint]
depends = ["//frontend:sync", "//:bench:sync"]
description = "ソースとテストを型情報付きoxlintで検査する"
run = "oxlint --type-aware --deny-warnings frontend backend shared docs benchmarks vitest.config.ts vitest.e2e.config.ts"

[tasks."lint:fix"]
description = "oxlintの自動修正を適用する"
run = "oxlint --type-aware --deny-warnings --fix frontend backend shared docs benchmarks vitest.config.ts vitest.e2e.config.ts"

[tasks.format]
description = "sharedを含むリポジトリ全体をoxfmtで整形する"
dir = "{{ config_root }}"
env.NODE_PATH = "{{ config_root }}/node_modules"
run = "oxfmt --write ."

[tasks."format:check"]
description = "sharedを含むリポジトリ全体の整形を検査する"
dir = "{{ config_root }}"
env.NODE_PATH = "{{ config_root }}/node_modules"
run = "oxfmt --check ."

[tasks.test]
description = "ユニットテストを実行する"
run = "pnpm exec vitest run"

[tasks."hooks:install"]
description = "コミット前の整形・lintチェックを有効にする"
dir = "{{ config_root }}"
run = "git config --local core.hooksPath .githooks"

[tasks."test:watch"]
run = "pnpm exec vitest"

[tasks."test:coverage"]
description = "カバレッジを計測し、行・文・関数・分岐の90%しきい値を検査する"
run = "pnpm exec vitest run --coverage"

[tasks."test:e2e"]
description = "起動済みアプリとStorybookをPlaywrightで検証する"
run = "pnpm exec vitest run --config vitest.e2e.config.ts"

[tasks."test:shared"]
run = "pnpm exec vitest run --project shared"

[tasks."bench:sync"]
description = "比較用SvelteKitアプリの設定と型を同期する"
run = "pnpm --filter @pico-drop/bench-sveltekit exec svelte-kit sync"

[tasks."bench:build"]
description = "React Router / SvelteKitの比較用SSRアプリをビルドする"
run = "pnpm --filter '@pico-drop/bench-*' build"

[tasks."bench:check"]
description = "性能比較用アプリの型を検査する"
run = "pnpm --filter '@pico-drop/bench-*' check"

[tasks.bench]
description = "本番SSRビルドをChromiumで比較する（結果はbenchmarks/results/latest.json）"
depends = ["bench:build"]
run = "node benchmarks/run.mjs"
